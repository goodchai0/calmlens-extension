<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --accent: #2a9d8f; }
  body { width: 310px; margin: 0; padding: 14px 16px 16px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; opacity: .7; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  label.check { display: flex; align-items: flex-start; gap: 8px; margin: 7px 0; cursor: pointer; }
  label.check input { margin-top: 3px; accent-color: var(--accent); }
  select { padding: 4px 6px; max-width: 160px; }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  .hint { font-size: 12px; opacity: .65; margin: 2px 0 0 24px; }
  .site { padding: 8px 10px; border: 1px solid #8884; border-radius: 8px; }
  .status { padding: 8px 10px; border-radius: 8px; font-size: 13px; background: #8882; }
  .status.ok { background: #2a9d8f33; }
  .status.bad { background: #e7651733; }
  .status button { margin-top: 6px; display: block; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { padding: 5px 9px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; font: inherit; font-size: 13px; }
  .presets button:hover { background: #2a9d8f33; }
  footer { margin-top: 14px; font-size: 12px; opacity: .65; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 18px; height: 18px; }
</style>
</head>
<body>
  <header>
    <h1>CalmLens</h1>
    <label class="switch"><input type="checkbox" id="enabled"> On</label>
  </header>

  <div id="status" class="status">Checking this page...</div>

  <h2>Quick start</h2>
  <div class="presets">
    <button id="pComfort">Comfort</button>
    <button id="pNight">Night reading</button>
    <button id="pYT">YouTube focus</button>
    <button id="pReset">Reset</button>
  </div>

  <div class="site" style="margin-top:14px">
    <label class="check" style="margin:0"><input type="checkbox" id="pause"> <span>Pause on <b id="host">this site</b></span></label>
  </div>

  <h2>Reading comfort</h2>
  <label class="row">Font
    <select id="font">
      <option value="default">Site default</option>
      <option value="easy">Easy sans (Verdana)</option>
      <option value="friendly">Friendly (Comic style)</option>
      <option value="serif">Serif (Georgia)</option>
    </select>
  </label>
  <label class="row">Text spacing
    <select id="spacing">
      <option value="0">Off</option>
      <option value="1">Comfy</option>
      <option value="2">Roomy</option>
      <option value="3">Extra roomy</option>
    </select>
  </label>
  <label class="row">Color tint
    <select id="tint">
      <option value="none">None</option>
      <option value="cream">Cream</option>
      <option value="blue">Soft blue</option>
      <option value="mint">Mint</option>
      <option value="rose">Rose</option>
      <option value="warm">Warm (night)</option>
    </select>
  </label>
  <label class="row">Dim screen <span id="dimVal">0%</span>
    <input type="range" id="dim" min="0" max="50" step="5" value="0">
  </label>
  <label class="check"><input type="checkbox" id="ruler"> <span>Reading ruler<br><span class="hint" style="margin:0">Highlights a band that follows your mouse</span></span></label>

  <h2>YouTube focus</h2>
  <label class="check"><input type="checkbox" id="ytShorts"> <span>Hide Shorts<br><span class="hint" style="margin:0">Shorts links open as normal videos</span></span></label>
  <label class="check"><input type="checkbox" id="ytHome"> <span>Hide home recommendations</span></label>
  <label class="check"><input type="checkbox" id="ytRelated"> <span>Hide recommended videos beside a video</span></label>
  <label class="check"><input type="checkbox" id="ytComments"> <span>Hide comments</span></label>
  <label class="check"><input type="checkbox" id="ytEndCards"> <span>Hide end-of-video suggestions</span></label>

  <footer>Changes apply instantly. If a page looks odd, pause CalmLens on that site.</footer>
  <script src="popup.js"></script>
</body>
</html>
